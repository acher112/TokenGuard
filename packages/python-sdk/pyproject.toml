[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tokenguard"
version = "0.1.0"
description = "Monitor AI agents, track LLM costs, debug failures"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "TokenGuard" }]
requires-python = ">=3.8"
keywords = ["ai", "llm", "monitoring", "tracing", "openai", "groq", "cost"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
groq = ["groq>=0.4.0"]

[project.urls]
Homepage = "https://github.com/yourusername/tokenguard"
Documentation = "https://yourapp.com/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["tokenguard*"]
